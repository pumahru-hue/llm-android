name: Make keystore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and commit keystore
        shell: bash
        run: |
          if [ -f debug.keystore ]; then echo "already exists"; exit 0; fi
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add debug.keystore
          git commit -m "Add fixed debug keystore"
          git push
