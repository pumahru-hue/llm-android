name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: gradle assembleDebug --stacktrace > build.log 2>&1
      - name: Show error
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=Gradle::build.log not created"
            exit 0
          fi
          txt=$(grep -nE "^e: |Caused by|OutOfMemory|incompatible|Unresolved|Internal compiler error|metadata|Exception:" build.log | grep -v "org.gradle" | head -25)
          [ -z "$txt" ] && txt=$(tail -n 40 build.log)
          msg=$(echo "$txt" | cut -c1-300 | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Kotlin::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
