name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        run: gradle assembleDebug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        shell: bash
        run: |
          if grep -q "What went wrong" build.log; then
            txt=$(grep -A12 "What went wrong" build.log)
          else
            txt=$(tail -n 40 build.log)
          fi
          msg=$(echo "$txt" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
